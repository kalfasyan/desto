site_name: desto
site_description: "desto — tmux session manager"
site_url: https://desto.readthedocs.io/en/latest/
docs_dir: docs
watch:
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
  - User Guide:
      - Terminal UI: user-guide/tui.md
      - CLI: user-guide/cli.md
      - Favorites: user-guide/favorites.md
      - Scheduling: user-guide/scheduling.md
      - SQLite Persistence: user-guide/sqlite-persistence.md
      - Session Usage: user-guide/session-usage.md
  - Reference:
      - Configuration: reference/configuration.md
  - Community:
      - Contributing: community/CONTRIBUTING.md
      - Security: community/SECURITY.md
      - Code of Conduct: community/CODE_OF_CONDUCT.md

theme:
  name: material
  custom_dir: theme

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - docs
        - .
  - pymdownx.pathconverter:
      base_path: docs

extra:
  repo_url: https://github.com/kalfasyan/desto

plugins:
  - search
  - include-markdown
  - htmlproofer:
      raise_error: true
      # Don't fail the build when a site is briefly down or rate-limiting
      # the link checker. Dead links (404 and similar) still fail it.
      raise_error_excludes:
        429: ['*']
        502: ['*']
        503: ['*']
        504: ['*']
      ignore_urls:
        - localhost
        - pyproject.toml
        - https://github.com/gitleaks/gitleaks-action
        - https://github.com/kalfasyan/desto/actions
