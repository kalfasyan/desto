name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Skip CI for version bump commits since publish workflow will run tests
    if: ${{ !contains(github.event.head_commit.message, 'Bump version') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Start Redis
        run: docker run -d -p 6379:6379 --name redis-test redis:7-alpine
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install package and dev dependencies (from uv.lock)
        run: uv sync --frozen --extra dev
      - name: Run ruff
        run: uv run --frozen ruff check .
      - name: Run pytest (fast tests only, skip Docker)
        run: uv run --frozen pytest -m "not docker and not slow" tests/
